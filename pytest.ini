[pytest]
# Avoid colliding top-level `tests` packages across bot + dashboard when
# collecting both trees from the repo root (plan Task 9 combined command).
addopts = --import-mode=importlib
pythonpath =
    my_vocard_setup
    my_vocard_dashboard_setup
testpaths =
    my_vocard_setup/tests
    my_vocard_dashboard_setup/tests
